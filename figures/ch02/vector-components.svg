<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">ベクトルの直交成分への分解</title>
  <desc id="desc">原点から斜め右上へ向かうベクトルAを、x方向の成分Axとy方向の成分Ayに分けた図。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c7fb8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d95f0e"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#756bb1"/>
    </marker>
    <marker id="arrow-axis" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fff"/>
  <line x1="110" y1="340" x2="650" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <line x1="110" y1="340" x2="110" y2="55" stroke="#333" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <text x="660" y="349" font-family="sans-serif" font-size="24">x</text>
  <text x="96" y="45" font-family="sans-serif" font-size="24">y</text>
  <text x="85" y="370" font-family="sans-serif" font-size="20">O</text>

  <line x1="110" y1="340" x2="535" y2="105" stroke="#756bb1" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text x="354" y="184" font-family="sans-serif" font-size="28" font-style="italic" fill="#5e4fa2">A</text>

  <line x1="110" y1="340" x2="535" y2="340" stroke="#2c7fb8" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="315" y="380" font-family="sans-serif" font-size="26" fill="#2166ac">A<tspan baseline-shift="sub" font-size="18">x</tspan> i</text>

  <line x1="535" y1="340" x2="535" y2="105" stroke="#d95f0e" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <text x="558" y="230" font-family="sans-serif" font-size="26" fill="#b35806">A<tspan baseline-shift="sub" font-size="18">y</tspan> j</text>

  <line x1="535" y1="105" x2="110" y2="105" stroke="#666" stroke-width="1.5" stroke-dasharray="7 7"/>
  <path d="M160 340 A50 50 0 0 0 154 316" fill="none" stroke="#333" stroke-width="2"/>
  <text x="165" y="320" font-family="sans-serif" font-size="22">θ</text>

  <rect x="511" y="316" width="24" height="24" fill="none" stroke="#555" stroke-width="2"/>
</svg>
