<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">二つの力の向きによる合力の違い</title>
  <desc id="desc">30ニュートンと40ニュートンの力を、同じ向き、反対向き、直角方向に加えた三つの場合を比較する図。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2474b5"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d86b27"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7a4da1"/></marker>
    <style>
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.label{font:600 22px system-ui,sans-serif;fill:#1f2937}.text{font:18px system-ui,sans-serif;fill:#374151}.small{font:16px system-ui,sans-serif;fill:#4b5563}.box{fill:#e5e7eb;stroke:#4b5563;stroke-width:2}.blue{stroke:#2474b5;stroke-width:6}.orange{stroke:#d86b27;stroke-width:6}.purple{stroke:#7a4da1;stroke-width:6}.guide{stroke:#9ca3af;stroke-width:2;stroke-dasharray:6 5;fill:none}
    </style>
  </defs>
  <rect class="panel" x="10" y="10" width="300" height="320" rx="14"/>
  <rect class="panel" x="330" y="10" width="300" height="320" rx="14"/>
  <rect class="panel" x="650" y="10" width="300" height="320" rx="14"/>

  <text class="label" x="160" y="45" text-anchor="middle">同じ向き</text>
  <rect class="box" x="65" y="145" width="60" height="50" rx="5"/>
  <line class="blue" x1="125" y1="158" x2="210" y2="158" marker-end="url(#arrow-blue)"/>
  <line class="orange" x1="125" y1="182" x2="235" y2="182" marker-end="url(#arrow-orange)"/>
  <line class="purple" x1="95" y1="235" x2="265" y2="235" marker-end="url(#arrow-purple)"/>
  <text class="small" x="175" y="142">30 N</text><text class="small" x="195" y="213">40 N</text>
  <text class="text" x="160" y="285" text-anchor="middle">合力 70 N →</text>

  <text class="label" x="480" y="45" text-anchor="middle">反対向き</text>
  <rect class="box" x="450" y="145" width="60" height="50" rx="5"/>
  <line class="blue" x1="510" y1="158" x2="590" y2="158" marker-end="url(#arrow-blue)"/>
  <line class="orange" x1="450" y1="182" x2="345" y2="182" marker-end="url(#arrow-orange)"/>
  <line class="purple" x1="480" y1="235" x2="395" y2="235" marker-end="url(#arrow-purple)"/>
  <text class="small" x="550" y="142">30 N</text><text class="small" x="350" y="213">40 N</text>
  <text class="text" x="480" y="285" text-anchor="middle">合力 10 N ←</text>

  <text class="label" x="800" y="45" text-anchor="middle">直角</text>
  <rect class="box" x="690" y="205" width="60" height="50" rx="5"/>
  <line class="blue" x1="750" y1="230" x2="845" y2="230" marker-end="url(#arrow-blue)"/>
  <line class="orange" x1="720" y1="205" x2="720" y2="85" marker-end="url(#arrow-orange)"/>
  <path class="guide" d="M720 85 L845 230"/>
  <line class="purple" x1="720" y1="230" x2="842" y2="89" marker-end="url(#arrow-purple)"/>
  <text class="small" x="805" y="255">30 N</text><text class="small" x="665" y="145">40 N</text>
  <text class="text" x="800" y="300" text-anchor="middle">合力 50 N ↗</text>
</svg>
